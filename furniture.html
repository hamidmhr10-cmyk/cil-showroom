<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Collection — Sofas, Dining, Garden & TV Units | CIL</title>
  <meta name="description" content="Handcrafted sofas, dining sets, garden furniture and TV units sourced from China's finest manufacturers in Foshan and Shunde. UK delivery from Luton.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230D0D0D'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='44' fill='%23C9A84C' text-anchor='middle' font-weight='700'%3ECIL%3C/text%3E%3C/svg%3E">
</head>
<body data-page="furniture">
  <div id="site-nav"></div>

  <header class="page-hero page-hero--light">
    <div class="container">
      <p class="eyebrow reveal">Furniture Collection</p>
      <h1 class="reveal d1 blur">Furnish Your Life</h1>
      <hr class="gold-rule">
      <p class="reveal d2">Handcrafted sofas, dining sets, garden furniture and TV units — sourced from China’s finest manufacturers in Foshan and Shunde.</p>
    </div>
  </header>

  <div class="filter-bar filter-bar--light" id="furnFilter" role="tablist" aria-label="Filter furniture by category"></div>

  <section class="section" style="padding-top:2.5rem">
    <div class="container">
      <div class="grid" id="furnGrid"></div>
    </div>
  </section>

  <section class="section section--dark newsletter">
    <div class="container">
      <h2 class="reveal">Designing a whole room?</h2>
      <p class="reveal d1">Tell us about your space and we’ll put together a tailored furniture quote.</p>
      <form class="newsletter__form reveal d2" data-inline-form data-success="Thank you! We’ll be in touch to help design your space.">
        <input type="email" name="email" placeholder="Your email address" aria-label="Email address" required>
        <button type="submit" class="btn btn--gold">Get in Touch</button>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="main.js"></script>
</body>
</html>
